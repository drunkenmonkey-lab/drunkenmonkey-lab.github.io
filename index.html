<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Drunken Monkey — Independent AI Safety & Evaluation Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
    }

    body {
      margin: 0;
      background: #f5f0e6;
      color: #171717;
      font-family: Georgia, serif;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5vh 6vw;
    }

    /* MAIN TITLE */

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 8.3vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.075em;
      line-height: 1;
      white-space: nowrap;
      margin: 0;
      transform: translateX(-11px);
    }

    /* LAB DESCRIPTION DIRECTLY UNDER TITLE */

    .subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.85rem, 1.35vw, 1.15rem);
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin: 0.35rem 0 0;
    }

    /* RESEARCH STATEMENT */

    .statement {
      max-width: 850px;
      font-size: clamp(1.1rem, 2.1vw, 2rem);
      line-height: 1.3;
    }

    .statement p {
      margin: 0 0 1.5rem;
    }

    /* MOTTO */

    .motto {
      font-weight: bold;
      font-size: 0.85em;
    }

    /* FOOTER */

    footer {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    /* CONTACT + IMPRESSUM */

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3.5rem;
    }

    footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    footer a:hover {
      opacity: 0.6;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page {
        padding: 5vh 5vw;
      }

      h1 {
        font-size: 8.1vw;
      }

      .subtitle {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
      }

      .statement {
        font-size: 1.1rem;
      }

      .statement p {
        margin-bottom: 1rem;
      }

      footer {
        font-size: 0.65rem;
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-links {
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: flex-start;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <header>

      <h1>DRUNKEN MONKEY</h1>

      <p class="subtitle">
        Independent AI Safety & Evaluation Lab
      </p>

    </header>

    <section class="statement">

      <p>
        We study how autonomous AI systems behave,
        how their behaviour is evaluated,
        and when those evaluations can be trusted.
      </p>

      <p class="motto">
        Less compute. Better questions.
      </p>

    </section>

    <footer>

      <span>
        INDEPENDENT RESEARCH IN PROGRESS
      </span>

      <div class="footer-links">

        <a href="mailto:write.drunkenmonkey@gmail.com">
          CONTACT ↗
        </a>

        <a href="impressum.html">
          IMPRESSUM ↗
        </a>

      </div>

    </footer>

  </main>

</body>
</html>
