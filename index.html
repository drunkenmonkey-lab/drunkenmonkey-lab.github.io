<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Drunken Monkey — Independent AI Safety & Evaluation Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f0e6;
      color: #171717;
      font-family: Georgia, serif;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5vh 6vw;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 8.3vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.075em;
      line-height: 1;
      white-space: nowrap;
      margin: 0;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: clamp(0.65rem, 1vw, 0.9rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 1.5rem;
    }

    .statement {
      max-width: 850px;
      font-size: clamp(1.1rem, 2.6vw, 2.5rem);
      line-height: 1.25;
    }

    .statement p {
      margin: 0 0 1.5rem;
    }

    .motto {
      font-weight: bold;
    }

    footer {
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    @media (max-width: 600px) {
      .page {
        padding: 5vh 5vw;
      }

      h1 {
        font-size: 8.1vw;
      }

      .statement {
        font-size: 1.3rem;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <h1>DRUNKEN MONKEY</h1>
      <p class="subtitle">
        Independent AI Safety & Evaluation Lab
      </p>
    </header>

    <section class="statement">
      <p>
        We study how autonomous AI systems behave,
        how their behaviour is evaluated,
        and when those evaluations can be trusted.
      </p>

      <p class="motto">
        Less compute. Better questions.
      </p>
    </section>

    <footer>
      <span>INDEPENDENT RESEARCH IN PROGRESS</span>
      <a href="mailto:write.drunkenmonkey@gmail.com">CONTACT ↗</a>
    </footer>

  </main>

</body>
</html>
